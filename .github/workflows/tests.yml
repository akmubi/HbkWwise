name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore HbkWwise.sln

      - name: Run tests
        run: dotnet test HbkWwise.sln -c Release --no-restore --logger "console;verbosity=normal"
